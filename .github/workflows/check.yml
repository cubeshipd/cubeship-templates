name: Check and publish templates
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['_catalog/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: templates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: cubeshipd/cubeship
          ref: master
          path: _cubeship
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: _cubeship/core/go.mod
          cache-dependency-path: _cubeship/core/go.sum
      - run: go run ./tools/templatecatalog -repo ../.. -out ../../_catalog/snapshot.json
        working-directory: _cubeship/core
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-snapshot
          path: _catalog/snapshot.json
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: catalog-snapshot
          path: _catalog
      - name: Publish validated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _catalog/snapshot.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish validated template catalog'
          git push origin HEAD:main
